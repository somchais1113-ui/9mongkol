<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>9มงคล — SVG Objects</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f2e7;color:#41271b;font-family:'Noto Sans Thai',Tahoma,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 20px 70px}h1{font-size:clamp(25px,3vw,38px);margin:0}.sub{color:#776452;margin-top:7px;margin-bottom:30px}.back{text-decoration:none;color:#a14a0b;font-weight:700}.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:17px}.asset{border:1px solid #e9d5b8;background:white;border-radius:16px;padding:13px;box-shadow:0 5px 14px #6a39000c}.visual{height:175px;border-radius:11px;display:grid;place-items:center;background-color:#620008;background-image:linear-gradient(45deg,#7b0310 25%,transparent 25%),linear-gradient(-45deg,#7b0310 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#7b0310 75%),linear-gradient(-45deg,transparent 75%,#7b0310 75%);background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0}.visual img{width:135px;height:135px;object-fit:contain}.filename{font-weight:800;font-size:13px;word-break:break-word;margin:12px 0 4px}.use{font-size:12px;color:#7e7062;margin-bottom:8px}.asset a{font-size:12px;color:#a1530a;font-weight:800;text-decoration:underline}.ref{margin-top:36px;border-top:1px solid #dec9ab;padding-top:25px}.ref img{max-width:100%;border-radius:12px;display:block;box-shadow:0 8px 25px #48351b26}.ref p{font-size:13px;color:#705a44}</style></head><body><div class="wrap"><p><a class="back" href="index.html">← กลับไป Live Preview</a></p><h1>SVG Object Library</h1><p class="sub">แยกไอคอนและลวดลายสำคัญเป็นเวกเตอร์ · เปิดไฟล์ SVG เพื่อตรวจดู/ปรับแต่งได้</p><div class="items" id="grid"></div><section class="ref"><h2>ภาพต้นแบบที่ใช้เทียบ</h2><p>ไฟล์อ้างอิงเท่านั้น ไม่ใช่ส่วนประกอบที่ HTML ต้องใช้</p><img loading="lazy" src="assets/reference/original_reference.png" alt="Original reference card"></section></div><script>const arr=[['target','เป้าหมาย Career Fit Index'],['laurel-left','ใบลอเรลซ้าย'],['laurel-right','ใบลอเรลขวา'],['arrow-up-right','ลูกศรปุ่ม CTA'],['sparkle','แสงดาวตกแต่ง'],['lotus','ดอกบัวสีทอง'],['check-shield','โล่เครื่องหมายตรวจสอบ'],['gold-coin','เหรียญทอง'],['lucky-nine','เลข 9 ตราแบรนด์']];document.getElementById('grid').innerHTML=arr.map(([f,d])=>`<article class="asset"><div class="visual"><img src="assets/icons/${f}.svg" alt="${d}"></div><div class="filename">${f}.svg</div><div class="use">${d}</div><a href="assets/icons/${f}.svg" target="_blank" rel="noopener">เปิดไฟล์ SVG ↗</a></article>`).join('');</script></body></html>
